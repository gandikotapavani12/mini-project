{% extends "base.html" %}

{% block title %}Login - InternMatch{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
            <p class="text-gray-600">Sign in to access your account</p>
        </div>

        <form method="POST" class="space-y-6">
            <!-- User Type Selection -->
            <div class="bg-gray-50 p-4 rounded-lg">
                <label class="block text-sm font-medium text-gray-700 mb-3">
                    I am a:
                </label>
                <div class="flex space-x-4">
                    <label class="flex items-center">
                        <input type="radio" name="user_type" value="student" checked
                               class="w-4 h-4 text-primary border-gray-300 focus:ring-primary">
                        <span class="ml-2 text-sm text-gray-700">Student</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="user_type" value="admin"
                               class="w-4 h-4 text-primary border-gray-300 focus:ring-primary">
                        <span class="ml-2 text-sm text-gray-700">Admin</span>
                    </label>
                </div>
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>
                <input type="email" id="email" name="email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="Enter your email address">
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="Enter your password">
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-primary to-secondary hover:from-secondary hover:to-primary text-white py-3 rounded-lg font-semibold transition duration-200 transform hover:scale-105">
                Sign In
            </button>
        </form>

        <!-- Admin Credentials Info
        <div class="mt-6 p-4 bg-yellow-50 rounded-lg">
            <h4 class="text-sm font-semibold text-yellow-800 mb-2">🔑 Admin Access</h4>
            <p class="text-xs text-yellow-700">
                Default admin credentials: <br>
                Email: admin@internship.com <br>
                Password: admin123
            </p>
        </div> -->

        <!-- Register Link -->
        <div class="text-center mt-6">
            <p class="text-gray-600">
                Don't have an account? 
                <a href="{{ url_for('register') }}" class="text-primary hover:text-secondary font-semibold">
                    Register here
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
